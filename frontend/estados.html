<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estados de cuenta | Mi Ahorro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main class="contenedor">
    <nav class="migas" aria-label="Ruta">
      <a href="inicio.html">Inicio</a><span>/</span><span>Estados de cuenta</span>
    </nav>

    <!-- Listado de estados de cuenta (del más reciente al más antiguo) -->
    <section class="tarjeta" id="seccionEstados">
      <header class="tarjeta-cab">
        <span class="cab-ico" data-ico="file"></span>
        <div>
          <h2>Estados de cuenta</h2>
          <p class="sub">Ordenados del más reciente al más antiguo. Seleccione un estado para consultar su detalle y movimientos.</p>
        </div>
      </header>
      <div class="tarjeta-cuerpo">
        <div id="contenido"><div class="cargando">Cargando estados de cuenta...</div></div>
      </div>
    </section>

    <!-- Consulta del estado de cuenta seleccionado y detalle cronológico de movimientos -->
    <section class="tarjeta" id="seccionDetalle" hidden>
      <header class="tarjeta-cab">
        <span class="cab-ico" data-ico="activity"></span>
        <div>
          <h2 id="detalleTitulo">Consulta de estado de cuenta</h2>
          <p class="sub" id="detalleSub">Resumen del período y detalle de movimientos en orden cronológico.</p>
        </div>
        <div class="cab-der">
          <button id="btnCerrarDetalle" class="btn blanco chico" type="button">
            <span data-ico="x"></span> Cerrar detalle
          </button>
        </div>
      </header>
      <div class="tarjeta-cuerpo" id="contenidoDetalle"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/estados.js"></script>
</body>
</html>
